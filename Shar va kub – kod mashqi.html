<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shar va kub</title>
<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#12151c;color:#e6e9f0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}
.app{display:grid;grid-template-columns:1fr 1fr;height:100%}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0}
.bar{padding:10px 14px;font-size:13px;color:#9aa3b5;border-bottom:1px solid #262b38;display:flex;justify-content:space-between;align-items:center;gap:8px}
.left{border-right:1px solid #262b38}
textarea{flex:1;width:100%;resize:none;border:0;outline:0;background:#171b24;color:#d7e0f5;font:15px/1.6 ui-monospace,Consolas,Menlo,monospace;padding:14px;tab-size:2;-webkit-user-select:text;user-select:text}
button{background:#3b82f6;color:#fff;border:0;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600;cursor:pointer}
button:hover{background:#2f6fda}
#err{min-height:22px;padding:4px 14px;font:13px ui-monospace,Consolas,monospace;color:#ff7b7b;background:#171b24}
.right{align-items:center}
canvas{flex:1;min-height:0;width:100%;max-width:520px}
.stats{display:flex;gap:12px;padding:10px 14px 16px;font-size:14px}
.chip{padding:6px 12px;border-radius:8px;background:#1d2230}
.ok b{color:#4ade80}.bad b{color:#ff7b7b}
@media (max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.left{border-right:0;border-bottom:1px solid #262b38}}
</style>
</head>
<body>
<div class="app">
  <section class="pane left">
    <div class="bar"><span>kod.js</span><button id="run">▶ Ishga tushirish</button></div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off">// Sizda ikkita tayyor o'zgaruvchi bor: ball va cube
//   ball.hit(cube)  -> shar sakrab kubga uriladi
//   cube.color      -> kubning hozirgi rangi (rang yo'q bo'lsa bo'sh)
//
// MASALA: shar kubga FAQAT kubning rangi o'zgarganda urilsin!

setInterval(function () {
  ball.hit(cube);
}, 1000);
</textarea>
    <div id="err"></div>
  </section>
  <section class="pane right">
    <div class="bar" style="width:100%"><span>Natija</span></div>
    <canvas id="cv" width="360" height="440"></canvas>
    <div class="stats">
      <div class="chip ok">To'g'ri: <b id="okN">0</b></div>
      <div class="chip bad">Xato: <b id="badN">0</b></div>
    </div>
  </section>
</div>
